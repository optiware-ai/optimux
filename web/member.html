<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n>Chat · Optimux</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/member.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans h-screen flex flex-col">
    <header class="flex flex-wrap items-center gap-3 px-4 py-2 border-b border-gray-800">
        <img src="/static/logo.svg" alt="" class="w-7 h-7">
        <div class="text-lg font-bold tracking-tight text-gray-100">Opti<span class="text-blue-400">mux</span></div>
        <label class="flex items-center gap-2 text-[13px] text-gray-400"><span data-i18n>Project</span>
            <select id="project" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 text-sm text-gray-200"></select></label>
        <button id="new-chat" type="button" class="px-3 py-1 rounded-lg border border-gray-700 text-sm text-gray-300 hover:text-white hover:border-gray-500" data-i18n>New chat</button>
        <label class="flex items-center gap-2 text-[13px] text-gray-400"><span data-i18n>My chats</span>
            <select id="chats" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 text-sm text-gray-200 max-w-[260px]"></select></label>
        <span class="flex-1"></span>
        <span id="who" class="text-sm text-gray-400"></span>
        <a href="/account" class="text-sm text-gray-300 hover:text-white" data-i18n>Account</a>
        <button id="sign-out" type="button" class="px-3 py-1 rounded-lg border border-gray-700 text-sm text-gray-300 hover:text-white hover:border-gray-500" data-i18n>Sign out</button>
    </header>

    <p id="notice" role="alert" class="hidden text-[14px] text-red-200 bg-red-950/60 border-b border-red-800 px-4 py-3"></p>

    <main id="chat" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 w-full max-w-3xl mx-auto" aria-live="polite"></main>

    <section id="approval" class="hidden border-t border-yellow-700 bg-yellow-950/40 px-4 py-3 w-full max-w-3xl mx-auto space-y-2" role="alertdialog" aria-labelledby="approval-title">
        <div id="approval-title" class="text-[13px] font-semibold text-yellow-200" data-i18n>The assistant asks your approval</div>
        <pre id="approval-text" class="text-[13px] text-gray-100 whitespace-pre-wrap break-words bg-gray-900 border border-gray-800 rounded-lg p-2 max-h-48 overflow-y-auto"></pre>
        <div class="flex flex-wrap items-center gap-2">
            <button id="approve" type="button" class="px-4 py-1.5 rounded-lg bg-green-700 hover:bg-green-600 text-white text-sm font-semibold" data-i18n>Approve</button>
            <button id="decline" type="button" class="px-4 py-1.5 rounded-lg border border-gray-600 text-sm text-gray-200 hover:border-gray-400" data-i18n>Decline</button>
            <input id="reason" type="text" maxlength="200" class="flex-1 min-w-[160px] bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-[13px] text-gray-200">
        </div>
    </section>

    <form id="form" class="border-t border-gray-800 px-4 py-3 w-full max-w-3xl mx-auto flex items-end gap-2">
        <textarea id="prompt" rows="2" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 outline-none focus:border-blue-500"></textarea>
        <button id="send" type="submit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold" data-i18n>Send</button>
        <button id="stop" type="button" class="hidden px-4 py-2 rounded-lg border border-red-700 text-sm text-red-300 hover:bg-red-950" data-i18n>Stop</button>
    </form>
</body>
</html>
