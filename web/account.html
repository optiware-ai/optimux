<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n>Your account · Optimux</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/account.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen p-4">
    <main class="w-full max-w-2xl mx-auto space-y-5 py-6">
        <header class="flex items-center gap-3">
            <img src="/static/logo.svg" alt="" class="w-9 h-9">
            <div class="text-xl font-bold tracking-tight text-gray-100">Opti<span class="text-blue-400">mux</span></div>
            <span id="who" class="text-sm text-gray-400"></span>
            <span class="flex-1"></span>
            <button id="sign-out" type="button" class="px-3 py-1.5 rounded-lg border border-gray-700 text-sm text-gray-300 hover:text-white hover:border-gray-500" data-i18n>Sign out</button>
        </header>

        <p id="disabled-note" role="alert" class="hidden text-[15px] text-red-200 bg-red-950/60 border border-red-800 rounded-xl p-4 leading-relaxed"></p>

        <p class="text-[13px] text-gray-400 bg-gray-900 border border-gray-800 rounded-xl p-4 leading-relaxed" data-i18n>Chats and projects for team members are coming in the next version of Optimux. For now you can see and change what your admin may see.</p>

        <section class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-3">
            <h2 class="text-[15px] font-bold text-gray-100" data-i18n>What your admin can see</h2>
            <p id="consent-text" class="text-[13px] text-gray-400 leading-relaxed"></p>
            <p class="text-sm text-gray-200"><span class="text-gray-500" data-i18n>Your choice now:</span> <b id="current"></b></p>
            <label class="flex items-start gap-2 text-sm"><input type="radio" name="chats" value="0" class="mt-1"><span data-i18n>Admin sees usage and cost only</span></label>
            <label class="flex items-start gap-2 text-sm"><input type="radio" name="chats" value="1" class="mt-1"><span data-i18n>Admin may also read my chats</span></label>
            <div class="flex items-center gap-3">
                <button id="save" type="button" class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold" data-i18n>Save my choice</button>
                <span id="saved" class="hidden text-[13px] text-green-400" data-i18n>Saved.</span>
                <span id="since" class="text-[12px] text-gray-500"></span>
            </div>
        </section>

        <section class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-3">
            <h2 class="text-[15px] font-bold text-gray-100" data-i18n>When your admin opened your data</h2>
            <p id="audit-empty" class="hidden text-[13px] text-gray-500 italic" data-i18n>Never so far.</p>
            <table id="audit" class="hidden w-full text-[13px]">
                <thead><tr class="text-left text-gray-500"><th class="py-1 pr-3 font-normal" data-i18n>When</th><th class="py-1 pr-3 font-normal" data-i18n>Admin</th><th class="py-1 pr-3 font-normal" data-i18n>What</th><th class="py-1 font-normal" data-i18n>Item</th></tr></thead>
                <tbody id="audit-rows"></tbody>
            </table>
        </section>

        <p id="error" class="hidden text-sm text-red-300 bg-red-950/50 border border-red-900 rounded-lg px-3 py-2"></p>
    </main>
</body>
</html>
